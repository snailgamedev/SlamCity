<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- no-cache so deploy updates show without a manual hard-refresh (2026-05-23 · the old v3.0.0 NUKE page was caching) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0a0d" />
<title>SLAM CITY · v1.1</title>
<style>
  :root {
    --bg-0: #0a0a0d;
    --bg-1: #14080a;
    --bg-2: #1a0e10;
    --bg-3: #2a1216;
    --red: #c8404a;
    --red-bright: #e04050;
    --red-deep: #a02030;
    --cream: #f4e6c8;
    --gold: #c8a060;
    --muted: #888;
    --soft: #aaa;
    --warn: #f4a05a;
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
    --safe-l: env(safe-area-inset-left, 0);
    --safe-r: env(safe-area-inset-right, 0);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg-0);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    min-height: 100dvh;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Arena background applies to all screens */
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(200,64,74,0.14), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(50,30,30,0.6), transparent 70%),
      linear-gradient(180deg, #0a0a0d 0%, #14080a 60%, #1a0a0c 100%);
    background-attachment: fixed;
  }

  /* Concrete-floor texture overlay */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 12px, rgba(255,255,255,0.012) 12px 13px),
      repeating-linear-gradient(90deg, transparent 0 12px, rgba(255,255,255,0.012) 12px 13px);
    mix-blend-mode: overlay;
  }

  /* SCREENS · only active visible */
  .screen { display: none; min-height: 100dvh; position: relative; z-index: 1; padding: max(16px, var(--safe-top)) max(12px, var(--safe-r)) max(16px, var(--safe-bottom)) max(12px, var(--safe-l)); }
  .screen.active { display: flex; flex-direction: column; }

  /* Title block reusable */
  .title-block { text-align: center; margin: 8px 0 16px; }
  .city { font-size: 11px; letter-spacing: 6px; color: var(--red); font-weight: 600; text-transform: uppercase; }
  .name { font-size: clamp(40px, 11vw, 76px); font-weight: 900; letter-spacing: 2px; color: var(--cream); text-shadow: 0 2px 0 #000, 0 4px 12px rgba(200,64,74,0.4); line-height: 0.95; margin: 2px 0 4px; }
  .role { font-size: 11px; letter-spacing: 3px; color: var(--muted); font-weight: 600; text-transform: uppercase; }

  /* ===== SPLASH ===== (LIVELINESS · iter 6 + adversarial-audit fixes 2026-05-23 · top-to-bottom reveal · synced breathing · consistent easing) */
  #splash { justify-content: center; align-items: center; text-align: center; gap: 24px; }
  /* Shared premium easing — ONE curve across the whole reveal (audit fix: was mixed cubic-bezier + plain ease-out) */
  .splash-title {
    font-size: clamp(56px, 16vw, 110px); font-weight: 900; letter-spacing: 4px;
    color: var(--cream); text-shadow: 0 2px 0 #000, 0 6px 20px rgba(200,64,74,0.6); line-height: 0.9;
    /* delay 0.35s so the title lands AFTER its "PRESENTS" label — top-to-bottom build, not hero-first (audit fix: reveal order was backwards) */
    animation: splash-title-enter 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both, splash-title-pulse 4.2s ease-in-out 1.3s infinite;
  }
  @keyframes splash-title-enter {
    0% { opacity: 0; transform: translateY(20px) scale(0.96); letter-spacing: 0px; }
    60% { opacity: 1; letter-spacing: 6px; }
    100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 4px; }
  }
  /* Pulse now has a perceptible heartbeat — scale + glow, not just an invisible 8px shadow delta (audit fix) */
  @keyframes splash-title-pulse {
    0%, 100% { text-shadow: 0 2px 0 #000, 0 6px 20px rgba(200,64,74,0.55); transform: scale(1); }
    50% { text-shadow: 0 2px 0 #000, 0 8px 34px rgba(200,64,74,0.95), 0 0 16px rgba(244,160,90,0.45); transform: scale(1.018); }
  }
  /* Two subs stagger: PRESENTS (top) leads at 0.1s, BROTHER CREW FIGHTER (bottom) follows at 0.75s — top-to-bottom (audit fix: both were 0.3s, popped simultaneously) */
  .splash-sub { font-size: 12px; letter-spacing: 8px; color: var(--red); text-transform: uppercase; animation: splash-sub-enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
  #splash .splash-sub:first-of-type { animation-delay: 0.1s; }
  @keyframes splash-sub-enter { 0% { opacity: 0; letter-spacing: 4px; } 100% { opacity: 0.85; letter-spacing: 8px; } }
  .splash-verse {
    max-width: 90vw; margin: 24px 0; padding: 20px 24px; border-left: 3px solid var(--gold);
    background: rgba(200,160,96,0.06); border-radius: 4px;
    animation: splash-verse-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both;
  }
  @keyframes splash-verse-enter { 0% { opacity: 0; transform: translateX(-12px); } 100% { opacity: 1; transform: translateX(0); } }
  .splash-verse-text { font-style: italic; color: var(--cream); font-size: 14px; line-height: 1.6; }
  .splash-verse-ref { display: block; color: var(--gold); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; font-size: 11px; }
  /* Cross breathes in SYNC with the title: same 4.2s period + same 1.6s start → phase-locked, not drifting (audit fix: was 5s, drifted forever) */
  .splash-cross { color: var(--gold); margin-right: 6px; display: inline-block; animation: splash-cross-pulse 4.2s ease-in-out 1.3s infinite; }
  @keyframes splash-cross-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.78; transform: scale(1.05); } }
  .btn {
    background: var(--red); color: var(--cream); border: none;
    padding: 16px 36px; font-size: 14px; font-weight: 900; letter-spacing: 3px;
    text-transform: uppercase; border-radius: 4px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(200,64,74,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, letter-spacing 0.2s ease-out;
    min-width: 200px; min-height: 48px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(200,64,74,0.55), inset 0 1px 0 rgba(255,255,255,0.15); letter-spacing: 4px; }
  .btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(200,64,74,0.4); transition-duration: 0.05s; }
  .btn-secondary { background: var(--bg-2); border: 1px solid var(--bg-3); }
  .btn-secondary:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
  /* Splash buttons stagger AFTER verse · top-to-bottom hierarchy · shared cubic-bezier easing (audit fix: was plain ease-out) */
  #splash .btn { animation: splash-btn-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.35s both; }
  #splash .btn + .btn { animation-delay: 1.6s; }
  @keyframes splash-btn-enter { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  .splash-foot { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 20px; text-transform: uppercase; animation: splash-foot-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.75s both; }
  @keyframes splash-foot-enter { 0% { opacity: 0; } 100% { opacity: 0.6; } }

  /* Accessibility · respect prefers-reduced-motion · vestibular-sensitive users skip the curtain reveal · final state still arrives */
  @media (prefers-reduced-motion: reduce) {
    .splash-title, .splash-sub, .splash-verse, .splash-cross, .splash-foot, .btn, #splash .btn { animation: none !important; transition: none !important; }
    .splash-title { opacity: 1; }
    .splash-sub { opacity: 0.85; }
    .splash-verse { opacity: 1; }
    .splash-foot { opacity: 0.6; }
    #splash .btn { opacity: 1; }
    .detail-stage svg, .ring-fighter.left svg, .ring-fighter.right svg { animation: none !important; }
    .btn:hover { transform: none; letter-spacing: 3px; }
  }

  /* ===== ROSTER ===== */
  #roster .roster-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #roster .roster-head .back { background: none; border: 1px solid var(--bg-3); color: var(--cream); padding: 8px 14px; border-radius: 4px; font-size: 11px; letter-spacing: 1px; min-height: 44px; cursor: pointer; }
  #roster .roster-head .head-title { font-size: 12px; letter-spacing: 4px; color: var(--red); font-weight: 700; text-transform: uppercase; }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding-bottom: 80px; }
  .roster-card {
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
    border: 1px solid var(--bg-3); border-top: 3px solid var(--red);
    border-radius: 6px; padding: 10px; cursor: pointer;
    transition: transform 0.14s cubic-bezier(0.16,1,0.3,1), border-color 0.14s, box-shadow 0.14s ease;
    position: relative; overflow: hidden;
  }
  /* desktop hover lift + glow (2026-05-23) */
  .roster-card:hover { transform: translateY(-3px); border-top-color: var(--red-bright); box-shadow: 0 7px 20px rgba(200,64,74,0.22), inset 0 0 0 1px rgba(200,64,74,0.18); }
  /* mobile press — enhanced with shadow (the touch-target feedback) */
  .roster-card:active { transform: scale(0.97); border-color: var(--red-bright); box-shadow: 0 2px 10px rgba(200,64,74,0.32); transition-duration: 0.06s; }
  .roster-card .portrait { width: 100%; aspect-ratio: 1; margin-bottom: 6px; position: relative; }
  .roster-card .portrait svg { width: 100%; height: 100%; }
  .roster-card .rc-name { font-size: 13px; font-weight: 900; color: var(--cream); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
  .roster-card .rc-arch { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .roster-card .rc-ovr { position: absolute; top: 6px; right: 8px; font-size: 16px; font-weight: 900; color: var(--cream); text-shadow: 0 1px 0 #000; }
  .roster-card .rc-slot { position: absolute; top: 8px; left: 8px; font-size: 8px; color: var(--muted); font-weight: 700; }
  .roster-card .rc-delta { position: absolute; top: 24px; right: 8px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; }
  .roster-card .rc-delta.up { color: #4ad06a; }
  .roster-card .rc-delta.down { color: var(--red-bright); }

  /* ===== DETAIL ===== */
  #detail .detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #detail .back-btn { background: none; border: 1px solid var(--bg-3); color: var(--cream); padding: 8px 14px; border-radius: 4px; font-size: 11px; min-height: 44px; cursor: pointer; }
  .detail-stage { position: relative; width: 100%; max-width: 380px; aspect-ratio: 3/4; margin: 0 auto; }
  .detail-stage .floor-shadow { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%); width: 60%; height: 4%; background: radial-gradient(ellipse, rgba(0,0,0,0.7), transparent 70%); z-index: 0; }
  .detail-stage .spotlight { position: absolute; top: -8%; left: 50%; transform: translateX(-50%); width: 80%; height: 110%; background: radial-gradient(ellipse at 50% 10%, rgba(255,220,180,0.08), transparent 60%); z-index: 0; pointer-events: none; }
  .detail-stage svg { width: 100%; height: 100%; position: relative; z-index: 1; animation: idle-breathe 3.6s ease-in-out infinite; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)); }
  @keyframes idle-breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.005); } }

  .stats-card { width: 100%; max-width: 480px; margin: 12px auto 0; background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%); border: 1px solid var(--bg-3); border-top: 3px solid var(--red); padding: 16px 18px; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  .stats-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--bg-3); }
  .stats-head .slot { font-size: 10px; color: var(--muted); letter-spacing: 2px; }
  .stats-head .ovr { font-size: 36px; font-weight: 900; color: var(--cream); line-height: 1; }
  .stats-head .ovr-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-align: right; margin-top: 4px; }
  .stat-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .stat-label { width: 84px; color: var(--soft); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .stat-bar { flex: 1; height: 8px; background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 2px; overflow: hidden; position: relative; }
  .stat-fill { height: 100%; background: linear-gradient(90deg, var(--red) 0%, var(--warn) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); transition: width 0.4s; }
  .stat-num { width: 28px; text-align: right; color: var(--cream); font-weight: 700; font-size: 12px; margin-left: 10px; }
  .finishers { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--bg-3); }
  .fin-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; }
  .fin-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .fin-pill { background: var(--bg-3); border: 1px solid var(--red); padding: 4px 10px; border-radius: 3px; font-size: 11px; font-weight: 700; color: var(--cream); letter-spacing: 1px; }
  .fin-pill.signature { border-color: var(--gold); color: var(--gold); }
  .walkout { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--bg-3); }
  .walkout-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .walkout-quote { font-style: italic; color: var(--cream); font-weight: 500; padding-left: 10px; border-left: 2px solid var(--gold); line-height: 1.55; font-size: 13px; }
  .walkout-cross { color: var(--gold); margin-right: 4px; font-style: normal; }
  .walkout-ref { display: block; color: var(--gold); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; font-size: 10px; }
  .vibe-line { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--bg-3); font-size: 11px; color: var(--soft); font-style: italic; line-height: 1.4; }

  .action-row { display: flex; gap: 10px; margin: 16px auto; max-width: 480px; padding: 0 4px; }
  .action-row .btn { flex: 1; padding: 14px 20px; font-size: 13px; min-width: 0; }

  /* ===== FIGHT ===== */
  #fight { padding-top: max(12px, var(--safe-top)); }
  .fight-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .round-label { font-size: 10px; letter-spacing: 3px; color: var(--red); font-weight: 700; text-transform: uppercase; }
  .round-num { font-size: 12px; color: var(--cream); font-weight: 700; }
  .fighter-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .fighter-slot { flex: 1; }
  .fs-name { font-size: 11px; font-weight: 900; color: var(--cream); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .fs-name.right { text-align: right; }
  .hp-bar-outer { height: 14px; background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 2px; overflow: hidden; position: relative; }
  .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #4ad06a 0%, #f4a05a 60%, var(--red) 100%); transition: width 0.4s; }
  .hp-bar-fill.right { transform: scaleX(-1); transform-origin: center; }
  /* low-HP danger pulse (2026-05-23 · filter+shadow only · no transform = right bar scaleX(-1) preserved) */
  .hp-bar-fill.danger { animation: hp-danger 0.7s ease-in-out infinite; }
  @keyframes hp-danger { 0%,100% { filter: brightness(1); box-shadow: none; } 50% { filter: brightness(1.4); box-shadow: 0 0 9px rgba(255,70,70,0.75); } }
  .hp-num { font-size: 10px; color: var(--cream); position: absolute; top: 50%; transform: translateY(-50%); padding: 0 6px; font-weight: 700; }
  .hp-num.left { left: 0; }
  .hp-num.right { right: 0; }
  .st-bar-outer { height: 6px; background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .st-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--cream)); transition: width 0.3s; }
  .st-bar-fill.right { transform: scaleX(-1); transform-origin: center; }

  /* ARENA PRESENCE (2026-05-23 · fighters now stand IN a lit venue, not float in void · no z-index changes = flash/attacks untouched) */
  .ring { position: relative; flex: 1; min-height: 280px; margin: 8px 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px 8px; overflow: hidden; border-radius: 8px;
    background: radial-gradient(130% 90% at 50% 108%, rgba(200,64,74,0.13), transparent 56%), linear-gradient(180deg, transparent 44%, rgba(0,0,0,0.30)); }
  /* warmer, wider arena floor glow (was a thin red line) */
  .ring::before { content: ''; position: absolute; bottom: 5px; left: 6%; right: 6%; height: 12px; background: radial-gradient(70% 100% at 50% 50%, rgba(200,160,96,0.30), rgba(200,64,74,0.22) 55%, transparent); filter: blur(3px); }
  /* ARENA SPOTLIGHTS (2026-05-23 · fills the dead upper ring with two light cones angling toward the fighters + overhead red haze · z-index 0 + pointer-events none = flash/attacks untouched) */
  .ring::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 58%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 42% 130% at 27% -22%, rgba(200,160,96,0.11), transparent 60%),
      radial-gradient(ellipse 42% 130% at 73% -22%, rgba(200,160,96,0.11), transparent 60%),
      radial-gradient(ellipse 85% 65% at 50% -12%, rgba(200,64,74,0.07), transparent 72%); }
  .ring-fighter { position: relative; width: 50%; max-width: 250px; aspect-ratio: 3/4; z-index: 1; }
  /* PRESENCE BOOST (2026-05-23 · backlight behind fighter separates them from the dark bg + subtle brightness/contrast lift · keeps each fighter's identity-colors · ::before is behind the svg/flash so combat untouched) */
  .ring-fighter::before { content: ''; position: absolute; inset: 6% 6% 9% 6%; z-index: -1; pointer-events: none;
    background: radial-gradient(52% 58% at 50% 46%, rgba(255,214,176,0.13), rgba(200,64,74,0.06) 55%, transparent 72%); filter: blur(2px); }
  /* grounded shadow + red rim · brightness/contrast lift so fighters read clearer · NO svg z-index = flash/burst keep natural DOM order ON TOP */
  .ring-fighter svg { width: 100%; height: 100%; filter: drop-shadow(0 9px 10px rgba(0,0,0,0.72)) drop-shadow(0 0 16px rgba(200,64,74,0.13)) brightness(1.1) contrast(1.06); }
  .ring-fighter.left svg { animation: idle-bob-L 2.4s ease-in-out infinite; }
  .ring-fighter.right svg { animation: idle-bob-R 2.4s ease-in-out infinite; transform: scaleX(-1); }
  @keyframes idle-bob-L { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes idle-bob-R { 0%,100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-4px); } }

  .ring-fighter.attack-jab svg { animation: anim-jab 0.5s ease-out !important; }
  .ring-fighter.attack-cross svg { animation: anim-cross 0.55s ease-out !important; }
  .ring-fighter.attack-power svg { animation: anim-power 0.7s ease-out !important; }
  .ring-fighter.attack-finisher svg { animation: anim-finisher 1s ease-out !important; }
  .ring-fighter.right.attack-jab svg { animation: anim-jab-R 0.5s ease-out !important; }
  .ring-fighter.right.attack-cross svg { animation: anim-cross-R 0.55s ease-out !important; }
  .ring-fighter.right.attack-power svg { animation: anim-power-R 0.7s ease-out !important; }
  .ring-fighter.right.attack-finisher svg { animation: anim-finisher-R 1s ease-out !important; }
  .ring-fighter.hit svg { animation: anim-hit 0.4s ease-out !important; }
  .ring-fighter.right.hit svg { animation: anim-hit-R 0.4s ease-out !important; }
  .ring-fighter.ko svg { animation: anim-ko 1.2s ease-in forwards !important; opacity: 0.6; }
  .ring-fighter.right.ko svg { animation: anim-ko-R 1.2s ease-in forwards !important; opacity: 0.6; }

  /* Attack animations · attacker translates DEEP into opponent space for real contact */
  /* COLLISION FIX 2026-05-23 · lunges boosted so fighters genuinely CROSS into each other at contact (was 3px box-touch · now real overlap) · attacker meets defender, doesn't swing in place */
  @keyframes anim-jab { 0% { transform: translateX(0); } 45% { transform: translateX(120px) scale(1.06); } 60% { transform: translateX(112px) scale(1.06); } 100% { transform: translateX(0); } }
  @keyframes anim-jab-R { 0% { transform: scaleX(-1) translateX(0); } 45% { transform: scaleX(-1) translateX(120px) scale(1.06); } 60% { transform: scaleX(-1) translateX(112px) scale(1.06); } 100% { transform: scaleX(-1) translateX(0); } }
  @keyframes anim-cross { 0% { transform: translateX(0) rotate(0); } 45% { transform: translateX(150px) rotate(-10deg) scale(1.1); } 60% { transform: translateX(140px) rotate(-8deg) scale(1.1); } 100% { transform: translateX(0) rotate(0); } }
  @keyframes anim-cross-R { 0% { transform: scaleX(-1); } 45% { transform: scaleX(-1) translateX(150px) rotate(-10deg) scale(1.1); } 60% { transform: scaleX(-1) translateX(140px) rotate(-8deg) scale(1.1); } 100% { transform: scaleX(-1); } }

function shadeColor(hex, percent) {
  const n = parseInt(hex.replace('#',''), 16);
  let r = (n >> 16) + percent;
  let g = ((n >> 8) & 0xff) + percent;
  let b = (n & 0xff) + percent;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

/* ========== STATE ========== */
const SAVE_KEY = 'sc:save:v1';
const save = loadSave();
let currentDetail = null;
let match = null;

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.ovrDelta) parsed.ovrDelta = {};
      return parsed;
    }
  } catch(e) {}
  return { wins:0, losses:0, kos:0, finishers:0, scriptureStrikes:0, picks:{}, ovrDelta:{} };
}
function persistSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e) {}
}

/* OVR DYNAMIC SYSTEM · ratings respond to match results · floor 60 · ceiling 99 */
function getCurrentOVR(id) {
  const f = FIGHTERS.find(x => x.id === id);
  if (!f) return 0;
  const delta = save.ovrDelta[id] || 0;
  return Math.max(60, Math.min(99, f.ovr + delta));
}
function getOVRDelta(id) {
  return save.ovrDelta[id] || 0;
}
function adjustOVR(id, change) {
  const cur = getCurrentOVR(id);
  const target = Math.max(60, Math.min(99, cur + change));
  const actualChange = target - cur;
  save.ovrDelta[id] = (save.ovrDelta[id] || 0) + actualChange;
  return actualChange;
}

/* ========== SCREEN ROUTING ========== */
function goto(id) {
  // Kill pending hit-sound tones on transition so an abandoned fight doesn't leak phantom tones onto the next screen.
  // Exception: 'result' — the KO/finisher victory sound is INTENDED to ride into the result screen (bug-class #5 fix, 2026-05-23).
  if (id !== 'result' && typeof clearSounds === 'function') clearSounds();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id==='roster') buildRoster();
  if (id==='splash') refreshSplash();
  window.scrollTo(0,0);
}

/* ========== SPLASH ========== */
const SPLASH_VERSES = [
  { text:'Iron sharpeneth iron · so a man sharpeneth the countenance of his friend.', ref:'Proverbs 27:17' },
  { text:'I have fought a good fight · I have finished my course · I have kept the faith.', ref:'2 Timothy 4:7' },
  { text:'Whatsoever thy hand findeth to do · do it with thy might.', ref:'Ecclesiastes 9:10' },
  { text:'The race is not to the swift · nor the battle to the strong.', ref:'Ecclesiastes 9:11' },
  { text:'I can do all things through Christ which strengtheneth me.', ref:'Philippians 4:13' },
  { text:'Be strong and of a good courage · be not afraid · neither be thou dismayed.', ref:'Joshua 1:9' },
  { text:'Let us not be weary in well doing · for in due season we shall reap.', ref:'Galatians 6:9' }
];
function refreshSplash() {
  const d = new Date();
  const seed = d.getFullYear()*1000 + (d.getMonth()+1)*40 + d.getDate();
  const v = SPLASH_VERSES[seed % SPLASH_VERSES.length];
  document.getElementById('splash-verse-text').innerHTML = '<span class="splash-cross">✝</span>"' + v.text + '"';
  document.getElementById('splash-verse-ref').textContent = '— ' + v.ref + ' · KJV';
  if (save.wins + save.losses > 0) {
    document.getElementById('quick-play-btn').style.display = 'inline-block';
  }
}

/* ========== ROSTER ========== */
function buildRoster() {
  const grid = document.getElementById('roster-grid');
  grid.innerHTML = '';
  FIGHTERS.forEach(f => {
    const card = document.createElement('div');
    card.className = 'roster-card';
    card.onclick = () => openDetail(f.id);
    const cur = getCurrentOVR(f.id);
    const delta = getOVRDelta(f.id);
    const deltaTxt = delta === 0 ? '' : `<div class="rc-delta ${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '▲' : '▼'}${Math.abs(delta)}</div>`;
    card.innerHTML = `
      <div class="rc-slot">#${f.slot}</div>
      <div class="rc-ovr">${cur}</div>
      ${deltaTxt}
      <div class="portrait">${renderFighter(f.art)}</div>
      <div class="rc-name">${f.name}</div>
      <div class="rc-arch">${f.arch}</div>
    `;
    grid.appendChild(card);
  });
}

/* ========== DETAIL ========== */
function openDetail(id) {
  const f = FIGHTERS.find(x => x.id === id);
  if (!f) return;
  currentDetail = id;
  document.getElementById('detail-head-name').textContent = f.name;
  document.getElementById('detail-svg-mount').innerHTML = renderFighter(f.art);
  const sc = document.getElementById('detail-stats');
  const cur = getCurrentOVR(f.id);
  const delta = getOVRDelta(f.id);
  const deltaTxt = delta === 0 ? '' : `<span style="font-size:12px; color:${delta > 0 ? '#4ad06a' : 'var(--red-bright)'}; letter-spacing:1px; margin-left:6px;">${delta > 0 ? '▲' : '▼'}${Math.abs(delta)}</span>`;
  sc.innerHTML = `
    <div class="stats-head">
      <div><div class="slot">SLOT ${f.slot} · ${f.arch} · BASE ${f.ovr}</div></div>
      <div><div class="ovr">${cur}${deltaTxt}</div><div class="ovr-label">OVR</div></div>
    </div>
    ${statRow('Striking',f.stats.striking)}
    ${statRow('Grappling',f.stats.grappling)}
    ${statRow('Stamina',f.stats.stamina)}
    ${statRow('Heart',f.stats.heart)}
    ${statRow('Charisma',f.stats.charisma)}
    <div class="finishers">
      <div class="fin-label">SIGNATURE FINISHERS</div>
      <div class="fin-list">
        ${f.finishers.map(x => `<span class="fin-pill signature">${x}</span>`).join('')}
      </div>
    </div>
    <div class="walkout">
      <div class="walkout-label">✝ Walkout Scripture · ${f.walkout.label}</div>
      <div class="walkout-quote"><span class="walkout-cross">✝</span>"${f.walkout.text}"</div>
      <span class="walkout-ref">— ${f.walkout.ref}</span>
    </div>
    <div class="vibe-line">${f.vibe}</div>
  `;
  goto('detail');
}
function statRow(label, val) {
  return `<div class="stat-row"><span class="stat-label">${label}</span><div class="stat-bar"><div class="stat-fill" style="width:${val}%"></div></div><span class="stat-num">${val}</span></div>`;
}

/* ========== COMBAT ENGINE ========== */
function startMatchWith(playerId) {
  const player = FIGHTERS.find(f => f.id === playerId);
  const pool = FIGHTERS.filter(f => f.id !== playerId);
  const opponent = pool[Math.floor(Math.random()*pool.length)];
  match = {
    player, opponent,
    pHP: 100, oHP: 100,
    pST: 100, oST: 100,
    round: 1,
    turn: 'player',
    log: [],
    locked: false,
    finishedFighter: null
  };
  save.picks[playerId] = (save.picks[playerId] || 0) + 1;
  persistSave();
  renderFight();
  goto('fight');
  showWalkout(player);
}

function showWalkout(fighter) {
  // Brief entrance beat · NON-BLOCKING (no match-lock, pointer-events none) so smoke + fast players act freely · auto-fades.
  const w = fighter && fighter.walkout;
  const el = document.getElementById('walkout-intro');
  if (!w || !el) return;
  document.getElementById('wi-label').textContent = w.label || 'WALKOUT';
  document.getElementById('wi-name').textContent = fighter.name;
  document.getElementById('wi-verse').innerHTML = '<span class="wi-cross">✝</span>"' + w.text + '"';
  document.getElementById('wi-ref').textContent = '— ' + w.ref;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2000);
}

function quickPlay() {
  const ids = Object.keys(save.picks);
  let pick = ids[Math.floor(Math.random()*ids.length)];
  if (!pick) pick = FIGHTERS[Math.floor(Math.random()*FIGHTERS.length)].id;
  startMatchWith(pick);
}

function renderFight() {
  const { player, opponent, pHP, oHP, pST, oST, round, turn } = match;
  document.getElementById('left-name').textContent = player.name;
  document.getElementById('right-name').textContent = opponent.name;
  document.getElementById('fight-round').textContent = round;
  document.getElementById('fight-turn-indicator').textContent = turn === 'player' ? 'Your Turn' : opponent.name + ' attacking';
  document.getElementById('fight-turn-indicator').style.color = turn === 'player' ? 'var(--cream)' : 'var(--red)';
  document.getElementById('left-hp').style.width = pHP + '%';
  document.getElementById('right-hp').style.width = oHP + '%';
  // low-HP danger pulse (2026-05-23 · pulses the bar near death · filter/shadow only so the right bar's scaleX(-1) is preserved)
  document.getElementById('left-hp').classList.toggle('danger', pHP > 0 && pHP < 25);
  document.getElementById('right-hp').classList.toggle('danger', oHP > 0 && oHP < 25);
  document.getElementById('left-hp-num').textContent = Math.max(0, Math.round(pHP));
  document.getElementById('right-hp-num').textContent = Math.max(0, Math.round(oHP));
  document.getElementById('left-st').style.width = pST + '%';
  document.getElementById('right-st').style.width = oST + '%';
  document.getElementById('ring-left-svg').innerHTML = renderFighter(player.art);
  document.getElementById('ring-right-svg').innerHTML = renderFighter(opponent.art);
  renderMoves();
  renderLog();
}

function renderMoves() {
  const grid = document.getElementById('moves-grid');
  grid.innerHTML = '';
  match.player.moves.forEach((m, i) => {
    const btn = document.createElement('button');
    let cls = 'move-btn';
    if (m.sig) cls += ' signature';
    if (m.fin) cls += ' finisher';
    const finisherLocked = m.fin && match.pHP > 30; // finishers unlock when low HP
    if (finisherLocked) cls += ' locked';
    btn.className = cls;
    const enabled = !match.locked && match.turn === 'player' && match.pST >= m.cost && !finisherLocked;
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? 1 : 0.45;
    btn.innerHTML = `<span class="move-name">${m.name}</span><span class="move-cost">${m.fin ? (finisherLocked ? 'HP < 30 to use' : '✝ FINISHER · ' + m.cost + ' ST') : (m.sig ? 'SIGNATURE · ' : '') + m.cost + ' ST'}</span>`;
    btn.onclick = () => playerAct(m);
    grid.appendChild(btn);
  });
}

function renderLog() {
  const el = document.getElementById('combat-log');
  el.innerHTML = match.log.slice(-5).map(l => `<div class="log-line ${l.cls}">${l.text}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function pushLog(text, cls='') {
  match.log.push({ text, cls });
  renderLog();
}

function playerAct(move) {
  if (match.locked || match.turn !== 'player') return;
  if (match.pST < move.cost) return;
  match.locked = true;
  match.pST -= move.cost;
  const acc = move.acc + (match.player.stats.striking - 80) * 0.002;
  const hit = Math.random() < acc;
  const baseDmg = move.dmg[0] + Math.random() * (move.dmg[1] - move.dmg[0]);
  const dmg = hit ? Math.round(baseDmg * (move.type === 'finisher' ? 1 : (move.type === 'power' ? 1.0 : 0.9))) : 0;

  document.getElementById('ring-left').classList.add('attack-' + move.type);
  setTimeout(() => document.getElementById('ring-left').classList.remove('attack-' + move.type), 700);

  setTimeout(() => {
    if (hit) {
      match.oHP = Math.max(0, match.oHP - dmg);
      const heavy = move.type === 'power' || move.type === 'finisher';
      document.getElementById('ring-right').classList.add(heavy ? 'hit-heavy' : 'hit');
      flash('right', heavy);
      burst('right', dmg);
      shakeRing(heavy);
      playHitSound(move.type);
      pushLog(`${match.player.name} → ${move.name} · ${dmg} dmg`, move.fin ? 'crit' : 'player');
      if (move.fin) {
        save.finishers++;
        save.scriptureStrikes++;
        const sf = match.player.art.scriptureFinisher;
        if (sf) pushLog(`✝ ${sf.text} — ${sf.ref}`, 'scripture');
      }
      setTimeout(() => document.getElementById('ring-right').classList.remove(heavy ? 'hit-heavy' : 'hit'), heavy ? 600 : 500);
    } else {
      pushLog(`${match.player.name} → ${move.name} · missed`, 'player');
      playMissSound();
    }
    setTimeout(() => {
      renderFight();
      if (match.oHP <= 0) {
        // Scripture-finisher KO gets a reverent verse-beat in the ring before resolving (2026-05-23). Non-finisher KO unchanged.
        if (move.fin) return showFinisherReverence(() => finishMatch('win'));
        return finishMatch('win');
      }
      match.turn = 'opponent';
      match.locked = false;
      renderFight();
      setTimeout(opponentAct, 900);
    }, 400);
  }, 350);
}

function opponentAct() {
  if (match.locked) return;
  match.locked = true;
  match.oST = Math.min(100, match.oST + 10);
  const opp = match.opponent;
  const usable = opp.moves.filter(m => match.oST >= m.cost && !(m.fin && match.oHP > 30));
  let move;
  if (match.oHP < 35 && Math.random() < 0.6) {
    const fin = usable.find(m => m.fin);
    move = fin || usable[Math.floor(Math.random()*usable.length)];
  } else if (match.oHP < 60 && Math.random() < 0.5) {
    const sig = usable.find(m => m.sig);
    move = sig || usable[Math.floor(Math.random()*usable.length)];
  } else {
    move = usable[Math.floor(Math.random()*usable.length)];
  }
  if (!move) move = opp.moves[0];
  match.oST -= move.cost;

  const acc = move.acc + (opp.stats.striking - 80) * 0.002;
  const hit = Math.random() < acc;
  const baseDmg = move.dmg[0] + Math.random() * (move.dmg[1] - move.dmg[0]);
  const dmg = hit ? Math.round(baseDmg * (move.type === 'finisher' ? 1 : (move.type === 'power' ? 1.0 : 0.9))) : 0;

  document.getElementById('ring-right').classList.add('attack-' + move.type);
  setTimeout(() => document.getElementById('ring-right').classList.remove('attack-' + move.type), 700);

  setTimeout(() => {
    if (hit) {
      match.pHP = Math.max(0, match.pHP - dmg);
      const heavy = move.type === 'power' || move.type === 'finisher';
      document.getElementById('ring-left').classList.add(heavy ? 'hit-heavy' : 'hit');
      flash('left', heavy);
      burst('left', dmg);
      shakeRing(heavy);
      playHitSound(move.type);
      pushLog(`${opp.name} → ${move.name} · ${dmg} dmg`, move.fin ? 'crit' : 'enemy');
      if (move.fin) {
        const sf = opp.art.scriptureFinisher;
        if (sf) pushLog(`✝ ${sf.text} — ${sf.ref}`, 'scripture');
      }
      setTimeout(() => document.getElementById('ring-left').classList.remove(heavy ? 'hit-heavy' : 'hit'), heavy ? 600 : 500);
    } else {
      pushLog(`${opp.name} → ${move.name} · missed`, 'enemy');
      playMissSound();
    }
    setTimeout(() => {
      match.pST = Math.min(100, match.pST + 12);
      renderFight();
      if (match.pHP <= 0) {
        return finishMatch('loss');
      }
      match.turn = 'player';
      match.locked = false;
      renderFight();
    }, 400);
  }, 350);
}

function flash(side, heavy) {
  const el = document.getElementById(side + '-flash');
  el.classList.remove('fire', 'fire-heavy');
  void el.offsetWidth;
  el.classList.add(heavy ? 'fire-heavy' : 'fire');
}
function burst(side, dmg) {
  const el = document.getElementById(side + '-burst');
  el.textContent = '-' + dmg;
  el.style.top = '38%';
  // Position at contact point · for left defender = their right edge · for right defender = their left edge
  el.style.left = side === 'left' ? '88%' : '12%';
  // Severity scaling (2026-05-23): big hits LOOK big · jab=small gold · power=bigger red · finisher=huge bright-red
  el.classList.remove('go', 'dmg-big', 'dmg-huge');
  if (dmg >= 45) el.classList.add('dmg-huge');
  else if (dmg >= 20) el.classList.add('dmg-big');
  void el.offsetWidth;
  el.classList.add('go');
}
function shakeRing(heavy) {
  const r = document.getElementById('ring');
  r.classList.remove('shake', 'shake-heavy');
  void r.offsetWidth;
  r.classList.add(heavy ? 'shake-heavy' : 'shake');
}

function showFinisherReverence(cb) {
  // Holds the winner's scripture-finisher verse reverently in the ring, then proceeds. Graceful: if data/element missing, never block the KO.
  const sf = match.player.art && match.player.art.scriptureFinisher;
  const el = document.getElementById('finisher-reverence');
  if (!sf || !el) { cb(); return; }
  document.getElementById('fr-verse').innerHTML = '<span class="fr-cross">✝</span>"' + sf.text + '"';
  document.getElementById('fr-ref').textContent = '— ' + sf.ref + ' · KJV';
  el.classList.add('on');
  setTimeout(() => { el.classList.remove('on'); setTimeout(cb, 480); }, 2000);
}
function finishMatch(result) {
  const lossSide = result === 'win' ? 'right' : 'left';
  document.getElementById('ring-' + lossSide).classList.add('ko');
  playKOSound();
  if (result === 'win') { save.wins++; save.kos++; }
  else save.losses++;

  // Dynamic OVR adjustment · win = +2 (+1 extra if finisher) · loss = -2 (-1 extra if KO'd)
  const playerId = match.player.id;
  const oppId = match.opponent.id;
  const playerBefore = getCurrentOVR(playerId);
  const oppBefore = getCurrentOVR(oppId);
  let playerChange, oppChange;
  if (result === 'win') {
    playerChange = adjustOVR(playerId, 2);
    oppChange = adjustOVR(oppId, -2);
    // Underdog bonus · beating someone higher-OVR gives more
    if (oppBefore > playerBefore + 3) playerChange += adjustOVR(playerId, 1);
  } else {
    playerChange = adjustOVR(playerId, -2);
    oppChange = adjustOVR(oppId, 2);
  }
  const playerAfter = getCurrentOVR(playerId);
  const oppAfter = getCurrentOVR(oppId);
  persistSave();

  setTimeout(() => {
    const banner = document.getElementById('result-banner');
    banner.textContent = result === 'win' ? 'VICTORY' : 'KNOCKED OUT';
    banner.classList.toggle('loss', result === 'loss');
    const arrowP = playerChange > 0 ? '▲' : (playerChange < 0 ? '▼' : '·');
    const arrowO = oppChange > 0 ? '▲' : (oppChange < 0 ? '▼' : '·');
    const colorP = playerChange > 0 ? '#4ad06a' : 'var(--red-bright)';
    const colorO = oppChange > 0 ? '#4ad06a' : 'var(--red-bright)';
    document.getElementById('result-detail').innerHTML =
      (result === 'win'
        ? `${match.player.name} stands tall.<br>${match.opponent.name} could not answer the bell.`
        : `${match.opponent.name} wins by KO.<br>${match.player.name} comes back stronger.`)
      + `<div style="margin-top:14px; font-size:12px; letter-spacing:1px;">`
      + `<div>${match.player.name} OVR: ${playerBefore} → <strong style="color:${colorP}">${playerAfter} ${arrowP}${Math.abs(playerChange)}</strong></div>`
      + `<div>${match.opponent.name} OVR: ${oppBefore} → <strong style="color:${colorO}">${oppAfter} ${arrowO}${Math.abs(oppChange)}</strong></div>`
      + `</div>`;

    const sf = result === 'win' ? match.player.art.scriptureFinisher : null;
    const sb = document.getElementById('result-scripture-block');
    if (sf) {
      sb.style.display = 'block';
      document.getElementById('result-scripture-text').innerHTML = '<span class="walkout-cross">✝</span>"' + sf.text + '"';
      document.getElementById('result-scripture-ref').textContent = '— ' + sf.ref + ' · KJV';
    } else {
      sb.style.display = 'none';
    }

    document.getElementById('career-strip').innerHTML = `
      <div><strong>${save.wins}</strong>WINS</div>
      <div><strong>${save.losses}</strong>LOSSES</div>
      <div><strong>${save.kos}</strong>KOs</div>
      <div><strong>${save.finishers}</strong>FINISHERS</div>
    `;
    goto('result');
  }, 1400);
}

/* ========== WEBAUDIO SYNTH SOUNDS (no asset files · per WUD pattern) ========== */
let actx = null;
function ensureCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  return actx;
}
function tone(freq, dur, type='sine', vol=0.15, slide=0) {
  const ctx = ensureCtx(); if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), ctx.currentTime + dur);
  g.gain.value = 0;
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur);
}
/* Tracked sfx delays · cleared on screen-transition so multi-tone hit sounds can't bleed phantom tones onto the next screen (bug-class #5 · web-audio-overlap · fixed 2026-05-23) */
let soundTimers = [];
function sfxDelay(fn, ms) { const id = setTimeout(fn, ms); soundTimers.push(id); return id; }
function clearSounds() { soundTimers.forEach(clearTimeout); soundTimers = []; }
function playHitSound(type) {
  if (type === 'jab') tone(220, 0.12, 'square', 0.1, -80);
  else if (type === 'cross') { tone(180, 0.16, 'square', 0.12, -100); sfxDelay(()=>tone(140,0.1,'sawtooth',0.08,-60),60); }
  else if (type === 'power') { tone(120, 0.25, 'sawtooth', 0.18, -80); sfxDelay(()=>tone(80,0.2,'triangle',0.12,-40),80); }
  else if (type === 'finisher') {
    tone(110, 0.3, 'sawtooth', 0.2, -60);
    sfxDelay(()=>tone(220,0.18,'square',0.15,0),100);
    sfxDelay(()=>tone(440,0.25,'triangle',0.12,200),250);
    sfxDelay(()=>tone(660,0.4,'sine',0.1,300),420);
  }
}
function playMissSound() { tone(180, 0.08, 'sine', 0.06, -40); }
function playKOSound() {
  tone(80, 0.5, 'sawtooth', 0.2, -40);
  sfxDelay(()=>tone(60,0.6,'sine',0.15,-30),200);
  sfxDelay(()=>tone(440,0.3,'triangle',0.12,0),700);
  sfxDelay(()=>tone(550,0.4,'sine',0.1,100),900);
}

/* ========== BOOT ========== */
refreshSplash();

</script>
